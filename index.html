<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロレtube</title>
    <link rel="icon" href="images (1).png" type="image/png">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #0f0f0f; color: #fff;
            font-family: 'Roboto', Arial, sans-serif;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background-color: #212121;
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #383838;
        }
        h1 { margin: 0; font-size: 20px; color: #ff0000; cursor: pointer; }
        .upload-btn {
            background-color: #cc0000; color: white; border: none;
            padding: 8px 16px; border-radius: 18px; font-weight: bold; cursor: pointer;
        }
        .upload-btn:hover { background-color: #e60000; }

        .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
        
        .video-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }
        .video-card {
            background: #1f1f1f; border-radius: 12px; overflow: hidden;
            cursor: pointer; transition: 0.2s; display: flex; flex-direction: column;
        }
        .video-card:hover { transform: scale(1.02); }
        .thumbnail-container { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .video-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .video-title { font-size: 16px; font-weight: bold; margin: 0; word-break: break-all; }
        .video-stats { font-size: 13px; color: #aaa; display: flex; justify-content: space-between; }

        .del-request-btn {
            background: #333; color: #ff4d4d; border: none; padding: 4px 8px;
            border-radius: 4px; font-size: 12px; cursor: pointer; margin-top: 6px; align-self: flex-start;
        }
        .del-request-btn:hover { background: #ff4d4d; color: #fff; }

        /* モーダル共通 */
        #upload-modal, #player-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #212121; padding: 24px; border-radius: 12px; width: 90%; max-width: 450px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .modal-content h2 { margin: 0 0 10px 0; font-size: 18px; }
        .modal-content label { font-size: 14px; color: #aaa; }
        .modal-content input[type="text"], .modal-content input[type="file"] {
            width: 100%; padding: 10px; background: #121212; border: 1px solid #383838;
            color: #fff; border-radius: 6px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .cancel-btn { background: #444; color: #fff; }
        .submit-btn { background: #3ea6ff; color: #000; }

        /* くるくるローディング画面 */
        #loading-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 2000;
            justify-content: center; align-items: center; flex-direction: column; gap: 16px;
            color: #fff; font-size: 16px; font-weight: bold;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #383838;
            border-top: 5px solid #ff0000; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 再生モーダル */
        .player-content { width: 90%; max-width: 800px; display: flex; flex-direction: column; gap: 12px; background: #212121; padding: 20px; border-radius: 12px; }
        .player-content video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; }
        .player-actions { display: flex; justify-content: space-between; align-items: center; }
        .close-player { background: #444; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .like-btn { background: #2e7d32; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .like-btn:disabled { background: #555; color: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1 onclick="loadVideos()">▶ ロレtube</h1>
        <button class="upload-btn" onclick="openUploadModal()">＋ 投稿</button>
    </header>

    <div class="container">
        <div id="video-grid" class="video-grid"></div>
    </div>

    <!-- アップロード中のくるくるローディング画面 -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div>動画を最適化してアップロード中...</div>
    </div>

    <!-- 投稿モーダル -->
    <div id="upload-modal">
        <div class="modal-content">
            <h2>動画をアップロード</h2>
            <label>タイトル</label>
            <input type="text" id="video-title" placeholder="動画のタイトルを入力">
            <label>サムネイル画像</label>
            <input type="file" id="thumb-file" accept="image/*">
            <label>動画ファイル</label>
            <input type="file" id="video-file" accept="video/*">
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeUploadModal()">キャンセル</button>
                <button class="submit-btn" onclick="uploadVideo()">アップロード</button>
            </div>
        </div>
    </div>

    <!-- 再生モーダル -->
    <div id="player-modal">
        <div class="player-content">
            <video id="active-player" controls></video>
            <h2 id="player-title" style="margin:0;"></h2>
            <div class="player-actions">
                <button class="like-btn" id="like-action-btn">👍 高評価 (<span id="player-likes">0</span>)</button>
                <button class="close-player" onclick="closePlayer()">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyX9Cb15kpNYsKLahtFzo_08etEy28dcLLyG3e_YwqRnKYfbMFxCDCki1nfwmB6cBnF/exec';

        window.onload = loadVideos;

        function loadVideos() {
            fetch(`${GAS_API_URL}?action=list`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        renderGrid(data.videos);
                    }
                });
        }

        function renderGrid(videos) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';

            videos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';

                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${v.thumbnail || ''}" alt="サムネイル">
                    </div>
                    <div class="video-info">
                        <p class="video-title">${escapeHtml(v.title)}</p>
                        <div class="video-stats">
                            <span>閲覧: ${v.views}回</span>
                            <span>👍 ${v.likes}</span>
                        </div>
                        <button class="del-request-btn" onclick="event.stopPropagation(); requestDelete('${v.id}')">削除要請する</button>
                    </div>
                `;

                card.onclick = () => openPlayer(v);
                grid.appendChild(card);
            });
        }

        function openUploadModal() { document.getElementById('upload-modal').style.display = 'flex'; }
        function closeUploadModal() { document.getElementById('upload-modal').style.display = 'none'; }
        function showLoading() { document.getElementById('loading-overlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

        function openPlayer(video) {
            const player = document.getElementById('active-player');
            player.src = video.videoUrl;
            document.getElementById('player-title').textContent = video.title;
            
            const likeBtn = document.getElementById('like-action-btn');
            const likesCountEl = document.getElementById('player-likes');
            likesCountEl.textContent = video.likes;

            const likedList = JSON.parse(localStorage.getItem('liked_videos') || '[]');
            if (likedList.includes(video.id)) {
                likeBtn.disabled = true;
                likeBtn.textContent = `👍 高評価済み (${video.likes})`;
            } else {
                likeBtn.disabled = false;
                likeBtn.textContent = `👍 高評価 (${video.likes})`;
                likeBtn.onclick = () => {
                    fetch(GAS_API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'like', id: video.id })
                    }).then(() => {
                        likedList.push(video.id);
                        localStorage.setItem('liked_videos', JSON.stringify(likedList));
                        video.likes++;
                        likesCountEl.textContent = video.likes;
                        likeBtn.disabled = true;
                        likeBtn.textContent = `👍 高評価済み (${video.likes})`;
                        loadVideos();
                    });
                };
            }

            document.getElementById('player-modal').style.display = 'flex';
            player.play();
        }

        function closePlayer() {
            const player = document.getElementById('active-player');
            player.pause();
            player.src = '';
            document.getElementById('player-modal').style.display = 'none';
        }

        function uploadVideo() {
            const title = document.getElementById('video-title').value.trim();
            const thumbFile = document.getElementById('thumb-file').files[0];
            const videoFile = document.getElementById('video-file').files[0];

            if (!title || !videoFile) {
                alert('タイトルと動画ファイルは必須です！');
                return;
            }

            closeUploadModal();
            showLoading();

            const readerThumb = new FileReader();
            readerThumb.onload = function(e) {
                const thumbBase64 = e.target.result;

                const videoElement = document.createElement('video');
                videoElement.src = URL.createObjectURL(videoFile);
                videoElement.muted = true;
                videoElement.playsInline = true;

                videoElement.onloadedmetadata = function() {
                    let width = videoElement.videoWidth;
                    let height = videoElement.videoHeight;
                    const maxWidth = 720;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    videoElement.width = width;
                    videoElement.height = height;
                    videoElement.play();

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');

                    const chunks = [];
                    const mediaStream = canvas.captureStream(30);
                    let recorder;

                    try {
                        recorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm;codecs=vp9' });
                    } catch (err) {
                        recorder = new MediaRecorder(mediaStream);
                    }

                    recorder.ondataavailable = function(event) {
                        if (event.data.size > 0) chunks.push(event.data);
                    };

                    recorder.onstop = function() {
                        const compressedBlob = new Blob(chunks, { type: 'video/webm' });
                        const readerCompressed = new FileReader();

                        readerCompressed.onload = function(ev) {
                            const videoBase64 = ev.target.result;

                            fetch(GAS_API_URL, {
                                method: 'POST',
                                body: JSON.stringify({
                                    action: 'upload',
                                    title: title,
                                    thumbnail: thumbBase64,
                                    videoUrl: videoBase64
                                })
                            })
                            .then(res => res.json())
                            .then(res => {
                                hideLoading();
                                if (res.status === 'success') {
                                    alert('投稿が完了しました！');
                                    document.getElementById('video-title').value = '';
                                    document.getElementById('thumb-file').value = '';
                                    document.getElementById('video-file').value = '';
                                    loadVideos();
                                } else {
                                    alert('エラーが発生しました');
                                }
                            }).catch(() => {
                                hideLoading();
                                alert('通信エラーが発生しました');
                            });
                        };
                        readerCompressed.readAsDataURL(compressedBlob);
                    };

                    recorder.start();

                    function drawFrame() {
                        if (videoElement.ended || videoElement.paused) {
                            recorder.stop();
                            return;
                        }
                        ctx.drawImage(videoElement, 0, 0, width, height);
                        requestAnimationFrame(drawFrame);
                    }

                    videoElement.onplay = () => {
                        requestAnimationFrame(drawFrame);
                    };
                };

                videoElement.onerror = function() {
                    const readerVideo = new FileReader();
                    readerVideo.onload = function(ev) {
                        sendDirect(title, thumbBase64, ev.target.result);
                    };
                    readerVideo.readAsDataURL(videoFile);
                };
            };

            if (thumbFile) {
                readerThumb.readAsDataURL(thumbFile);
            } else {
                readerThumb.onload({ target: { result: '' } });
            }
        }

        function sendDirect(title, thumbBase64, videoBase64) {
            fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'upload',
                    title: title,
                    thumbnail: thumbBase64,
                    videoUrl: videoBase64
                })
            })
            .then(res => res.json())
            .then(res => {
                hideLoading();
                if (res.status === 'success') {
                    alert('投稿が完了しました！');
                    loadVideos();
                } else {
                    alert('エラーが発生しました');
                }
            });
        }

        function requestDelete(id) {
            if (!confirm('この動画の削除要請を送りますか？')) return;

            fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'requestDelete', id: id })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    alert('削除要請を受け付けました。');
                    loadVideos();
                } else {
                    alert(res.message || 'すでに要請済みです。');
                }
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&'`<>]/g, match => ({
                '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '<': '&lt;', '>': '&gt;'
            }[match]));
        }
    </script>
</body>
</html>
